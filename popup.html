<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>UoB Calendar Export</title>
<style>
  :root {
    --ink: #1d1a1b;
    --muted: #6a6264;
    --line: #ddd6d7;
    --paper: #ffffff;
    --tint: #f7f2f3;
    --accent: #ab1f2d;
    --accent-ink: #ffffff;
    --ok: #1f6b45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f1eced;
      --muted: #a89fa1;
      --line: #423b3d;
      --paper: #231f20;
      --tint: #2d2829;
      --accent: #e0525f;
      --accent-ink: #1a1112;
      --ok: #6fcf9c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 330px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  header {
    padding: 14px 16px 12px;
    border-left: 5px solid var(--accent);
    background: var(--tint);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  main { padding: 12px 16px 16px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .range label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  input[type="month"] {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; width: 100%;
  }
  .count { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  .stepper {
    display: grid; grid-template-columns: 30px 1fr 30px;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .stepper button {
    width: auto; padding: 0; border-radius: 0; font-size: 15px; font-weight: 500;
    background: var(--tint); color: var(--ink);
  }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper input {
    font: inherit; font-weight: 600; text-align: center; color: var(--ink);
    background: var(--paper); border: 0; border-inline: 1px solid var(--line);
    padding: 5px 0; width: 100%; min-width: 0; -moz-appearance: textfield;
  }
  .presets { display: flex; gap: 6px; margin-top: 8px; }
  .presets button {
    width: auto; flex: 1; padding: 4px 0; font-weight: 500; font-size: 12px;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  .presets button[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  #rangeSummary { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .check { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .check input { margin: 2px 0 0; accent-color: var(--accent); }
  .check small { display: block; color: var(--muted); font-size: 11.5px; }
  button {
    font: inherit; font-weight: 600; width: 100%;
    border: 0; border-radius: 6px; padding: 9px 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin-top: 10px; min-height: 1em; font-size: 12.5px; }
  #status.error { color: var(--accent); }
  #status.ok { color: var(--ok); }
  #status ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
  #notPortal { display: none; }
  body.not-portal #notPortal { display: block; }
  body.not-portal #form { display: none; }
</style>
</head>
<body>
<header>
  <h1>UoB Calendar Export</h1>
  <p>Save your app.bristol.ac.uk calendar as an .ics file</p>
</header>
<main>
  <div id="notPortal">
    <p>Open the University app calendar and log in, then click this button again.</p>
    <button id="openPortal" type="button">Open app.bristol.ac.uk</button>
  </div>

  <div id="form">
    <fieldset>
      <legend>Months</legend>
      <div class="range">
        <label>Start <input type="month" id="from" required></label>
        <div class="count">
          <span id="countLabel">How many</span>
          <div class="stepper" role="group" aria-labelledby="countLabel">
            <button type="button" id="dec" aria-label="One month fewer">&minus;</button>
            <input type="number" id="count" min="1" max="24" value="12" inputmode="numeric" aria-labelledby="countLabel">
            <button type="button" id="inc" aria-label="One month more">+</button>
          </div>
        </div>
      </div>
      <div class="presets" role="group" aria-label="Quick choices">
        <button type="button" data-months="1">1 month</button>
        <button type="button" data-months="3">3</button>
        <button type="button" data-months="6">6</button>
        <button type="button" data-months="12">12</button>
      </div>
      <p id="rangeSummary"></p>
    </fieldset>

    <fieldset id="calendars">
      <legend>Include</legend>
      <label class="check"><input type="checkbox" value="Student Timetable" checked>
        <span>Timetable<small>Lectures, seminars and other teaching</small></span></label>
      <label class="check"><input type="checkbox" value="Key Dates" checked>
        <span>Key dates<small>Term dates, holidays and closures (all-day)</small></span></label>
      <label class="check"><input type="checkbox" value="Event Timetable" checked>
        <span>Event timetable</span></label>
      <label class="check"><input type="checkbox" value="CAMPUSM_REGISTERED_EVENTS" checked>
        <span>Events you've registered for</span></label>
      <label class="check"><input type="checkbox" value="CAMPUSM_TASKBOARD">
        <span>Taskboard to-dos<small>Deadlines shown as 1-hour slots</small></span></label>
    </fieldset>

    <fieldset>
      <legend>Options</legend>
      <label class="check"><input type="checkbox" id="typeInTitle" checked>
        <span>Add the session type to titles<small>e.g. "Information Technology (Lecture)"</small></span></label>
      <label class="check"><input type="checkbox" id="separateFiles">
        <span>One file per calendar<small>Useful for importing each into its own calendar</small></span></label>
      <label class="check"><input type="checkbox" id="saveAs">
        <span>Ask where to save</span></label>
    </fieldset>

    <button id="export" type="button">Export .ics</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</main>
<script src="exporter.js"></script>
<script src="popup.js"></script>
</body>
</html>
